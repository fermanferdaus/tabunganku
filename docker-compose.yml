services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tabunganku:1.0
    container_name: tabunganku
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tabunganku_net

  mysql:
    image: mariadb:10.11
    container_name: tabunganku_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tabunganku_net

volumes:
  mysql_data:
    driver: local

networks:
  tabunganku_net:
    driver: bridge
